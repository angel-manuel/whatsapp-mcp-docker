# Turns a failed *scheduled* dependency audit into a triage issue.
#
# A separate workflow rather than a job inside deps-audit.yml because that
# file is also called from ci.yml: a nested job asking for `issues: write`
# would force every PR run to grant it. `workflow_run` fires only for runs
# started by deps-audit.yml's own triggers (schedule / dispatch), never for
# the ci.yml call, and runs from the default branch with its own token.
#
# One open issue at a time: if one is already open, the new failure is added
# as a comment, so the issue's history is the triage record.
name: Dependency audit report

on:
  workflow_run:
    workflows: ["Dependency audit"]
    types: [completed]

permissions:
  contents: read

jobs:
  report:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      contains(fromJSON('["schedule","workflow_dispatch"]'), github.event.workflow_run.event)
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      TITLE: "Dependency audit failing (scheduled scan)"
    steps:
      - name: Open or update the triage issue
        run: |
          body=$(cat <<EOF
          The scheduled dependency audit failed: $RUN_URL

          Read the failing job's log or summary and classify each finding:

          - **OSV scan / govulncheck** (Go modules and stdlib): fix with
            \`go get <module>@<fixed>\` + \`go mod tidy\`, or a Go toolchain
            bump for a stdlib finding. If no fix can be taken, add a justified,
            time-boxed entry to \`osv-scanner.toml\` (\`ignoreUntil\` ≤ 90 days).
            govulncheck findings are reachable from our code and are fixed, not
            excepted.
          - **Image scan** (Docker Scout, fixable high/critical in a published
            image): merge or trigger the Dependabot base-image bump and cut a
            release. If the finding does not apply, add an OpenVEX statement to
            \`.github/vex/\` with a justification.

          A fix to a shipped dependency must be released (\`fix(deps)\`) to
          reach anyone.
          EOF
          )
          existing=$(gh issue list --state open --search "\"$TITLE\" in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still failing: $RUN_URL"
          else
            gh issue create --title "$TITLE" --label needs-triage --label dependencies --body "$body"
          fi
