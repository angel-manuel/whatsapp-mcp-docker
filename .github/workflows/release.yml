name: release

# Publishes the container image to Docker Hub.
#
# Triggered by:
#   * the release-please workflow, once it merges a release PR and creates the
#     tag → called as a reusable workflow with that tag. This is the normal
#     path: release-please owns the version, the tag and the changelog, and
#     this workflow only builds the images and appends their coordinates to
#     the release it already created.
#   * pushing a SemVer tag (v1.2.3, v1.2.3-rc1, …) by hand → same build; it
#     creates the GitHub release if release-please has not.
#   * manually via the Actions UI (workflow_dispatch) → builds + pushes the
#     branch-qualified tags (e.g. :master, :master-slim) so operators can
#     smoke-test the pipeline without cutting a release.
#
# The reusable-workflow entry point exists because a tag created by
# release-please with the default GITHUB_TOKEN does NOT fire `on: push: tags`
# — GitHub suppresses workflow triggers from GITHUB_TOKEN-authored events to
# prevent recursion. Calling this workflow directly sidesteps that with no PAT.
#
# Required repository secrets:
#   DOCKERHUB_USERNAME  — Docker Hub account that owns the namespace.
#   DOCKERHUB_TOKEN     — Docker Hub access token with write scope.
#
# TODO(hardening): cosign-sign the pushed images + attestations. Deferred from
# the basic-support milestone; tracked separately under the signing/hardening
# task.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_call:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v1.2.3)."
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: write   # needed for softprops/action-gh-release
  packages: write
  id-token: write   # reserved for future cosign keyless signing

env:
  IMAGE_NAME: docker.io/angelmanuel/whatsapp-mcp
  PLATFORMS: linux/amd64,linux/arm64
  # The tag being released: from the caller, or from the ref on a direct tag
  # push. Empty on a branch dispatch, which builds images but cuts no release.
  REF_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

jobs:
  build:
    name: build-${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: distroless
            dockerfile: Dockerfile
            suffix: ""
          - variant: slim
            dockerfile: Dockerfile.slim
            suffix: "-slim"
    outputs:
      digest-distroless: ${{ steps.capture.outputs.digest-distroless }}
      digest-slim:       ${{ steps.capture.outputs.digest-slim }}
      tag:               ${{ steps.capture.outputs.tag }}
      version:           ${{ steps.capture.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # On a workflow_call the ref is the caller's branch, so check the tag
          # out explicitly — otherwise this builds whatever master points at
          # when the job starts rather than the released commit.
          ref: ${{ env.REF_TAG || github.ref }}

      # The version every artifact is stamped with, derived from the tag rather
      # than from docker/metadata-action. metadata-action folds the `suffix=`
      # flavor into its `version` output, so the slim row reports `0.5.0-slim`;
      # using that for anything but tag names mislabels the distroless build,
      # and since matrix job outputs are last-writer-wins it poisoned the
      # release notes for both variants (v0.5.0 shipped advertising the
      # distroless image as `:0.5.0-slim` and the slim one as
      # `:0.5.0-slim-slim`).
      - name: Derive version
        id: version
        run: |
          if [ -n "$REF_TAG" ]; then
            echo "value=${REF_TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          # `latest=auto` tags the highest non-prerelease SemVer as :latest
          # (and :latest-slim for the slim matrix row via `suffix=`).
          flavor: |
            latest=auto
            suffix=${{ matrix.suffix }},onlatest=true
          # `value=` is what makes the semver rows work when this workflow is
          # *called*: github.ref is then the caller's branch, not the tag. On a
          # branch dispatch REF_TAG is empty, metadata-action falls back to the
          # ref, and the semver rows are skipped with a warning — intended.
          #
          # The `type=raw` line below also publishes :latest (and :latest-slim
          # via `onlatest=true`) on a manual `workflow_dispatch` from master.
          # That keeps :latest pointing at master in the pre-1.0 window when
          # no SemVer tag exists yet; once a SemVer tag is pushed `latest=auto`
          # takes over and overwrites :latest with the released version.
          # Manual dispatches from non-master branches do *not* touch :latest.
          tags: |
            type=semver,pattern={{version}},value=${{ env.REF_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.REF_TAG }}
            # Only on branch dispatches: a release build runs with the
            # caller's ref (master), and without this guard it would republish
            # :master from the release job.
            type=ref,event=branch,enable=${{ env.REF_TAG == '' }}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' }}
          labels: |
            org.opencontainers.image.title=whatsapp-mcp
            org.opencontainers.image.description=Single-container WhatsApp MCP server (whatsmeow + mcp-go)
            org.opencontainers.image.vendor=angelmanuel

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to:   type=gha,scope=${{ matrix.variant }},mode=max

      - name: Record digest output
        id: capture
        run: |
          {
            echo "digest-${{ matrix.variant }}=${{ steps.push.outputs.digest }}"
            echo "tag=$REF_TAG"
            echo "version=${{ steps.version.outputs.value }}"
          } >> "$GITHUB_OUTPUT"

      - name: Generate SPDX SBOM (syft)
        if: env.REF_TAG != ''
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: whatsapp-mcp-${{ steps.version.outputs.value }}${{ matrix.suffix }}.spdx.json
          # `artifact-name` names the FILE inside the upload, not just the
          # artifact, so it has to end in .spdx.json — as plain
          # `sbom-<variant>` it silently made the release job's
          # `sboms/*.spdx.json` glob match nothing. It must also stay unique
          # per matrix row: upload-artifact@v4 rejects duplicate names across
          # jobs in the same run.
          artifact-name: whatsapp-mcp-${{ steps.version.outputs.value }}${{ matrix.suffix }}.spdx.json
          upload-artifact: true
          upload-release-assets: false

  release-notes:
    name: release-notes
    needs: build
    if: needs.build.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Download SBOM artifacts
        uses: actions/download-artifact@v8
        with:
          # Only the SBOM artifacts; without this filter, download-artifact
          # also tries to fetch the buildx-internal `*.dockerbuild` provenance
          # blobs that build-push-action@v6 auto-attaches when `provenance:
          # true`, and one of those occasionally fails to download — failing
          # the whole job even though the images and SBOMs are fine.
          pattern: whatsapp-mcp-*.spdx.json
          path: sboms
          merge-multiple: true

      - name: Compose release body
        id: body
        env:
          VERSION:    ${{ needs.build.outputs.version }}
          DISTROLESS: ${{ needs.build.outputs.digest-distroless }}
          SLIM:       ${{ needs.build.outputs.digest-slim }}
        run: |
          {
            echo "## Container images"
            echo ""
            echo "Published to \`${IMAGE_NAME}\`."
            echo ""
            echo "### Distroless (primary)"
            echo ""
            echo "- Tag: \`${IMAGE_NAME}:${VERSION}\`"
            echo "- Digest: \`${DISTROLESS}\`"
            echo "- Pinnable: \`${IMAGE_NAME}@${DISTROLESS}\`"
            echo ""
            echo "### Slim (debian:bookworm-slim + ffmpeg)"
            echo ""
            echo "- Tag: \`${IMAGE_NAME}:${VERSION}-slim\`"
            echo "- Digest: \`${SLIM}\`"
            echo "- Pinnable: \`${IMAGE_NAME}@${SLIM}\`"
            echo ""
            echo "SBOMs (SPDX JSON) for both variants are attached to this release."
          } > release-notes.md
          {
            echo "body<<EOF"
            cat release-notes.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Attach images and SBOMs to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          # release-please has already written the changelog into the release
          # body by the time this runs, so append instead of replacing it. On a
          # hand-pushed tag no release exists yet and this creates one.
          append_body: true
          body: ${{ steps.body.outputs.body }}
          prerelease: ${{ contains(needs.build.outputs.tag, '-') }}
          files: sboms/*.spdx.json
          # Loud on purpose: `false` silently shipped a release whose body
          # claimed SBOMs were attached when none were.
          fail_on_unmatched_files: true
